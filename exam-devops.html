<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="themes.css">
<script src="themes.js"></script>
<link rel="stylesheet" href="quiz.css">
<script src="quizzes/devops-exam.js" defer></script>
<script src="quiz.js" defer></script>
<title>DevOps Final Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: black-and-white lecture-slide style. Condensed bold capitals for headings, thin rules, bordered boxes, sticky contents rail. */
:root{
  --bg:#ffffff; --surface-2:#f1f1f1; --ink:#000000; --muted:#3d3d3d; --line:#d0d0d0;
  --neg:#9b9b9b; --dim:#bdbdbd; --faint:#e2e2e2;
  --f-display:"Anton","Oswald","Impact","Arial Narrow",sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e0e; --surface-2:#1d1d1d; --ink:#f2f2f2; --muted:#b8b8b8; --line:#363636;
    --neg:#7d7d7d; --dim:#4d4d4d; --faint:#2a2a2a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e0e; --surface-2:#1d1d1d; --ink:#f2f2f2; --muted:#b8b8b8; --line:#363636;
  --neg:#7d7d7d; --dim:#4d4d4d; --faint:#2a2a2a; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:56px;max-width:1180px;margin:0 auto;padding-block:32px 96px}
@media (max-width:960px){.shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 64px}}

/* TOC */
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;max-height:calc(100vh - 40px);overflow:auto;font-size:13.5px;padding-right:4px}
.toc summary{font-family:var(--f-display);font-size:18px;letter-spacing:calc(.03em * var(--lk,1));text-transform:var(--lbl-tt,uppercase);cursor:pointer;padding:4px 0;border-bottom:var(--bw2,2px) solid var(--box,var(--ink))}
.toc ol{list-style:none;margin:0;padding:0}
.toc .chap{margin-top:14px}
.toc .chap > a{font-weight:var(--w-lbl,800);color:var(--ink);text-transform:var(--lbl-tt,uppercase);font-size:12.5px;letter-spacing:calc(.04em * var(--lk,1))}
.toc .chap ol{margin:4px 0 0 0;padding-left:10px;border-left:1px solid var(--box,var(--ink))}
.toc a{color:var(--muted);text-decoration:none;display:block;padding:2px 6px;line-height:1.35}
.toc a:hover{color:var(--ink);text-decoration:underline}
.toc a.active{color:var(--on-fill,var(--bg));background:var(--fill,var(--ink))}
@media (max-width:960px){.toc{position:static;max-height:none;border:var(--bw2,2px) solid var(--box,var(--ink));padding:4px 14px 10px}.toc summary{border-bottom:0}}

/* Type */
main{min-width:0}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;text-wrap:balance;line-height:1.08;margin:0;color:var(--ink)}
h1{font-size:clamp(2.6rem,6vw,4.4rem);text-transform:var(--lbl-tt,uppercase);letter-spacing:calc(.005em * var(--lk,1))}
h2{font-size:clamp(2rem,4.4vw,3rem);text-transform:var(--lbl-tt,uppercase);letter-spacing:calc(.01em * var(--lk,1))}
h3{font-size:clamp(1.5rem,2.6vw,1.9rem);margin-top:3rem;padding-bottom:6px;border-bottom:var(--bw15,1.5px) solid var(--box,var(--ink));scroll-margin-top:24px;letter-spacing:calc(.005em * var(--lk,1))}
h4{font-family:var(--f-body);font-weight:var(--w-lbl,800);font-size:1.02rem;margin-top:1.6rem;text-transform:var(--lbl-tt,uppercase);letter-spacing:calc(.04em * var(--lk,1))}
p,ul,ol.body{max-width:44rem}
p{margin:.85rem 0}
ul,ol.body{padding-left:1.3rem;margin:.6rem 0}
li{margin:.25rem 0}
strong,b{font-weight:700}
a{color:var(--link,var(--ink));text-decoration:underline;text-underline-offset:2px}
code,.mono{font-family:var(--f-mono);font-size:.86em}
code{background:var(--surface-2);padding:1px 5px}
.lede{font-size:1.12rem;max-width:42rem}
.muted{color:var(--muted)}
.small{font-size:.9rem}
mark{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg));padding:0 2px}

/* Hero */
.hero{display:grid;gap:14px}
.slidebar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:var(--bw15,1.5px) solid var(--box,var(--ink));border-bottom:var(--bw15,1.5px) solid var(--box,var(--ink));padding:6px 0;font-size:13px;font-weight:var(--w-lbl,800);text-transform:var(--lbl-tt,uppercase);letter-spacing:calc(.03em * var(--lk,1))}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* Chapter divider */
.chapter{scroll-margin-top:16px;padding-top:5rem}
.chapter-head{display:grid;gap:6px;justify-items:center;text-align:center;border-top:var(--bw2,2px) solid var(--box,var(--ink));border-bottom:var(--bw2,2px) solid var(--box,var(--ink));padding:30px 0 26px;margin-bottom:10px}
.chapter-head .num{font-weight:var(--w-lbl,800);font-size:13px;letter-spacing:calc(.12em * var(--lk,1));text-transform:var(--lbl-tt,uppercase)}
section.sub{scroll-margin-top:16px}

/* Callouts */
.call{max-width:44rem;padding:12px 16px;margin:1.2rem 0;border:var(--bw2,2px) solid var(--box,var(--ink));background:var(--bg)}
.call > .tag{display:inline-block;font-weight:var(--w-lbl,800);font-size:11.5px;letter-spacing:calc(.08em * var(--lk,1));text-transform:var(--lbl-tt,uppercase);margin-bottom:4px;padding:1px 7px;border:var(--bw15,1.5px) solid var(--box,var(--ink))}
.call p{margin:.35rem 0}
.call ul{margin:.3rem 0}
.call.use{background:var(--surface-2)}
.call.warn > .tag{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg))}
.call.key{border-width:3px}
.call.analogy{border-style:dashed}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:var(--w-lbl,800);font-size:11.5px;letter-spacing:calc(.06em * var(--lk,1));text-transform:var(--lbl-tt,uppercase);padding:3px 9px;border:var(--bw2,2px) solid var(--box,var(--ink));background:var(--bg)}
.chip.dash{border-style:dashed}
.chip.fill{background:var(--surface-2)}
.chip.inv{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg))}
.chip.thick{border-width:3px}
.chip.lab{border-style:double;border-width:4px}
.ref{display:inline-block;font-weight:var(--w-lbl,800);font-size:11px;letter-spacing:calc(.06em * var(--lk,1));text-transform:var(--lbl-tt,uppercase);line-height:1.4;padding:1px 7px;border:1px solid var(--box,var(--ink));color:var(--ink);background:var(--bg);white-space:nowrap;vertical-align:1px}
.ref.g{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg))}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin:.4rem 0 .2rem}

/* Math */
.math{max-width:44rem;overflow-x:auto;overflow-y:hidden;padding:6px 0;margin:.6rem 0}
.say{max-width:44rem;font-size:.95rem;color:var(--muted);border-left:3px solid var(--bar,var(--ink));padding:2px 0 2px 12px;margin:.2rem 0 1rem}

/* Tables */
.tbl{max-width:100%;overflow-x:auto;margin:1rem 0;border:var(--bw15,1.5px) solid var(--box,var(--ink));background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:var(--w-lbl,800);text-transform:var(--lbl-tt,uppercase);font-size:.78rem;letter-spacing:calc(.05em * var(--lk,1));background:var(--fill,var(--ink));color:var(--on-fill,var(--bg));white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td code{white-space:nowrap}

/* Lab boxes: "In the lab" (from the notebook) and "Try it" (live) */
.lab{background:var(--bg);border:var(--bw2,2px) solid var(--box,var(--ink));margin:1.8rem 0;overflow:hidden}
.lab.nb{border-style:double;border-width:5px}
.lab-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:10px 16px;border-bottom:var(--bw2,2px) solid var(--box,var(--ink))}
.lab-head .tag{font-weight:var(--w-lbl,800);font-size:11px;letter-spacing:calc(.1em * var(--lk,1));text-transform:var(--lbl-tt,uppercase);background:var(--fill,var(--ink));color:var(--on-fill,var(--bg));padding:2px 8px}
.lab-head h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.3rem;text-transform:none;letter-spacing:calc(.01em * var(--lk,1))}
.lab-body{padding:14px 16px 16px;display:grid;gap:12px}
.lab-body p{margin:.2rem 0}
pre.code{margin:0;font-family:var(--f-mono);font-size:13px;line-height:1.55;background:var(--surface-2);padding:10px 12px;overflow-x:auto;border-left:3px solid var(--bar,var(--ink))}
pre.out{margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;padding:8px 12px;overflow-x:auto;border:1px dashed var(--box,var(--ink));color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{font:inherit;font-size:13.5px;font-weight:700;padding:6px 12px;border:var(--bw15,1.5px) solid var(--box,var(--ink));background:var(--bg);color:var(--ink);cursor:pointer;line-height:1.3;border-radius:0}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg))}
.btn.on{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg))}
.btn.sm{font-size:12px;padding:3px 8px}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
label.ctl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
select,input[type=number],input[type=text]{font:inherit;font-size:14px;padding:5px 8px;border:var(--bw15,1.5px) solid var(--box,var(--ink));background:var(--bg);color:var(--ink);max-width:100%;border-radius:0}
input[type=text]{font-family:var(--f-mono);min-width:0;flex:1 1 220px}
input[type=range]{accent-color:var(--ink);width:180px;max-width:100%}
.readout{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:10px 12px;overflow-x:auto;line-height:1.55;white-space:pre-wrap;word-break:break-word;border-left:3px solid var(--bar,var(--ink))}
.status{font-size:14px;color:var(--muted);min-height:1.3em}
.hits{display:grid;gap:4px;font-size:14.5px}
.hits div{padding:4px 8px;border-left:3px solid var(--line)}
.hits div.rel{border-left-color:var(--ink)}
.hits .id{font-family:var(--f-mono);font-weight:700;margin-right:6px}
.toks{display:flex;flex-wrap:wrap;gap:4px}
.toks span{font-family:var(--f-mono);font-size:13px;border:var(--bw15,1.5px) solid var(--box,var(--ink));padding:1px 6px}
.toks span.gone{border-style:dashed;color:var(--neg);text-decoration:line-through}
.toks span.chg{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg))}
.stage{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:start}
.stage > b{font-size:12px;text-transform:var(--lbl-tt,uppercase);letter-spacing:calc(.05em * var(--lk,1));padding-top:3px}
@media (max-width:600px){.stage{grid-template-columns:minmax(0,1fr)}}
.plist{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.plist span{font-family:var(--f-mono);font-size:13px;border:var(--bw15,1.5px) solid var(--box,var(--ink));padding:2px 6px;min-width:40px;text-align:center}
.plist span.ptr{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg))}
.plist span.done{color:var(--neg);border-color:var(--neg)}
.plist span.ans{border-width:3px}
.plist .lbl{font-weight:var(--w-lbl,800);font-size:12px;text-transform:var(--lbl-tt,uppercase);letter-spacing:calc(.05em * var(--lk,1));min-width:70px;border:0}
.svgwrap{overflow-x:auto;max-width:100%}
svg text{font-family:var(--f-mono)}
svg.chart{width:100%;height:auto;display:block;max-width:640px}
.c-axis{stroke:var(--ink);stroke-width:1}
.c-grid{stroke:var(--line);stroke-width:1}
.c-txt{fill:var(--muted);font-size:11px}
.c-lin{fill:none;stroke:var(--neg);stroke-width:2;stroke-dasharray:6 4}
.c-curve{fill:none;stroke:var(--ink);stroke-width:2.5}
.c-cap{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3}
.c-dot{fill:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:1rem 0;max-width:none;list-style:none;padding:0;counter-reset:bx}
.boxes li{border:var(--bw2,2px) solid var(--box,var(--ink));padding:10px 12px;margin:0;font-size:.93rem;counter-increment:bx}
.boxes li::before{content:counter(bx) ". ";font-weight:var(--w-lbl,800)}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:1rem 0;font-weight:var(--w-lbl,800);font-size:12.5px;text-transform:var(--lbl-tt,uppercase);letter-spacing:calc(.04em * var(--lk,1))}
.pipe span{border:var(--bw2,2px) solid var(--box,var(--ink));padding:5px 10px}
.pipe i{font-style:normal}
.mrow{display:grid;grid-template-columns:28px 52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .rk{font-family:var(--f-display);font-size:20px}
.mrow .id{font-family:var(--f-mono);font-weight:700}
.mrow .tx{font-size:13.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .ct{display:flex;gap:4px;flex-wrap:wrap}
@media (max-width:600px){.mrow{grid-template-columns:24px 46px minmax(0,1fr)}.mrow .ct{grid-column:2 / -1}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi{border:var(--bw2,2px) solid var(--box,var(--ink));padding:6px 10px}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;font-weight:var(--w-lbl,800);text-transform:var(--lbl-tt,uppercase);letter-spacing:calc(.05em * var(--lk,1))}

/* Quiz */
.quiz{display:grid;gap:14px}
.q{border:var(--bw2,2px) solid var(--box,var(--ink));padding:12px 14px;background:var(--bg)}
.q p.qt{margin:0 0 8px;font-weight:var(--w-lbl,800)}
.q .opts{display:grid;gap:6px}
.q button.opt{text-align:left;font:inherit;font-size:15px;padding:7px 11px;border:var(--bw15,1.5px) solid var(--box,var(--ink));background:var(--bg);color:var(--ink);cursor:pointer;border-radius:0}
.q button.opt:hover{background:var(--surface-2)}
.q button.opt.right{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg))}
.q button.opt.right::after{content:"  ✓ correct";font-weight:var(--w-lbl,800)}
.q button.opt.wrong{color:var(--muted);text-decoration:line-through;border-style:dashed}
.q .why{margin-top:8px;font-size:15px;color:var(--muted)}

/* Players (Run / Step / Speed) */
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:var(--bw15,1.5px) solid var(--box,var(--ink));border-bottom:var(--bw15,1.5px) solid var(--box,var(--ink))}
.player .pos{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.player input[type=range]{width:110px}
.msg{font-size:14.5px;min-height:2.6em;padding:8px 12px;background:var(--surface-2);border-left:3px solid var(--bar,var(--ink))}
.msg b{font-weight:var(--w-lbl,800)}

/* Scan rows */
.scan{position:relative;max-height:380px;overflow:auto;border:var(--bw15,1.5px) solid var(--box,var(--ink));padding:4px 0}
.srow{display:grid;grid-template-columns:62px minmax(0,1fr) 22px;gap:8px;padding:3px 10px;border-left:4px solid transparent;font-size:14px;line-height:1.45}
.srow .id{font-family:var(--f-mono);font-weight:700}
.srow .relb{font-style:normal;font-size:9.5px;font-weight:var(--w-lbl,800);letter-spacing:calc(.06em * var(--lk,1));text-transform:var(--lbl-tt,uppercase);border:1px solid var(--box,var(--ink));padding:0 3px;margin-left:4px;vertical-align:2px}
.srow.pend{color:var(--neg)}
.srow.miss{color:var(--muted)}
.srow.hit{border-left-color:var(--ink)}
.srow.cur{background:var(--surface-2);outline:2px solid var(--ink);outline-offset:-2px}
.srow .mk{font-weight:var(--w-lbl,800);text-align:center}

/* Pipeline */
.stg{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border:1.5px solid var(--line)}
.stg > b{font-size:12px;text-transform:var(--lbl-tt,uppercase);letter-spacing:calc(.05em * var(--lk,1));padding-top:3px}
.stg.act{border:var(--bw2,2px) solid var(--box,var(--ink))}
.stg.wait{opacity:.35}
@media (max-width:600px){.stg{grid-template-columns:minmax(0,1fr)}}
.sw{background:var(--faint);border-bottom:var(--bw2,2px) dashed var(--box,var(--ink));padding:0 2px}
.numx{text-decoration:line-through;color:var(--neg)}
.toks span.cur{outline:3px solid var(--ink);outline-offset:1px}
.toks span.stopw{background:var(--faint);border-style:dashed}
.toks span.pend{color:var(--neg);border-color:var(--line)}
.toks s{color:var(--neg);text-decoration-thickness:2px}
.toks span.chg s{color:var(--on-fill,var(--bg));opacity:.6}
.stoplist{display:flex;flex-wrap:wrap;gap:4px}
.stoplist span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);padding:0 5px;color:var(--muted)}
.stoplist span.lit{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg));border-color:var(--ink)}
.stoplist span.now{outline:3px solid var(--ink);outline-offset:1px}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}

/* Index build */
.ixgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px}
@media (max-width:760px){.ixgrid{grid-template-columns:minmax(0,1fr)}}
.doccard{border:var(--bw2,2px) solid var(--box,var(--ink));padding:10px 12px;display:grid;gap:8px;align-content:start}
.doccard .id{font-family:var(--f-display);font-size:24px;line-height:1}
.ptable{display:grid;gap:3px}
.prow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
.prow > b{font-family:var(--f-mono);font-weight:700;text-align:right}
.prow.hot > b{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg));padding:0 4px}
.prow .plist span{font-size:12px;padding:1px 4px;min-width:34px}
.prow .plist span.new{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg))}

/* Race bars */
.race{display:grid;gap:2px;border:var(--bw15,1.5px) solid var(--box,var(--ink));padding:6px 10px}
.rrow{display:grid;grid-template-columns:26px 40px minmax(0,1fr) 54px;gap:6px;align-items:center;font-size:12.5px;font-family:var(--f-mono)}
.rrow .trk{height:12px;background:var(--faint);position:relative}
.rrow .bar{position:absolute;inset:0 auto 0 0;background:var(--fill,var(--ink));transition:width .3s ease}
.rrow.cur{outline:2px solid var(--ink);outline-offset:1px}
.rrow.z{opacity:.35}
.rrow.wait{opacity:.5}
.rrow .v{text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.rrow .bar{transition:none}}
.lk{font:inherit;font-family:var(--f-mono);font-weight:700;background:none;border:0;border-bottom:var(--bw15,1.5px) solid var(--box,var(--ink));color:var(--ink);cursor:pointer;padding:0}
.lk.sel{background:var(--fill,var(--ink));color:var(--on-fill,var(--bg))}
.why{display:grid;gap:10px}
.cbar{height:10px;background:var(--fill,var(--ink));display:block}

/* Bench bars */
.gbars{display:grid;gap:4px}
.gb{display:grid;grid-template-columns:26px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12.5px;font-family:var(--f-mono)}
.gb .tr{height:16px;position:relative}
.gb .g{position:absolute;inset:0 auto 0 0;border:var(--bw15,1.5px) solid var(--box,var(--ink));background:var(--bg)}
.gb .c{position:absolute;inset:3px auto 3px 3px;background:var(--fill,var(--ink))}
.gb.wait{opacity:.3}
.gb .v{text-align:right}
.mrow.cur{background:var(--surface-2);outline:2px solid var(--ink);outline-offset:-2px}

/* Quiz carousel */
.qc{border:var(--bw2,2px) solid var(--box,var(--ink));padding:14px 16px;display:grid;gap:12px}
.qc .eyebrow{font-weight:var(--w-lbl,800);font-size:12px;letter-spacing:calc(.08em * var(--lk,1));text-transform:var(--lbl-tt,uppercase);color:var(--muted)}
.qnav{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:var(--bw15,1.5px) solid var(--box,var(--ink));padding-top:10px}
.qnav .btn{min-width:56px;font-size:18px;padding:4px 14px}
.qnav .btn:disabled{opacity:.3;cursor:default}
.qdots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.qdots button{width:14px;height:14px;border-radius:50%;border:var(--bw2,2px) solid var(--box,var(--ink));background:var(--bg);padding:0;cursor:pointer}
.qdots button.now{outline:2px solid var(--ink);outline-offset:2px}
.qdots button.ok{background:var(--fill,var(--ink))}
.qdots button.bad{border-style:dashed;background:var(--faint)}
.qscore{font-weight:var(--w-lbl,800);font-size:12.5px;letter-spacing:calc(.05em * var(--lk,1));text-transform:var(--lbl-tt,uppercase)}

/* Recap */
.recap{border:var(--bw2,2px) solid var(--box,var(--ink));margin-top:3rem;padding:14px 18px}
.recap h3{border-bottom:0;padding-bottom:0;margin-top:0}
.recap ul{columns:2;column-gap:32px;max-width:none}
.recap li{break-inside:avoid}
@media (max-width:700px){.recap ul{columns:1}}
.foot{margin-top:5rem;font-size:13.5px;color:var(--muted);border-top:var(--bw15,1.5px) solid var(--box,var(--ink));padding-top:16px}

.theme-btn{width:100%;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.theme-btn .ico{font-family:var(--f-mono);font-weight:400}

.progress-pill{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(max(16px,env(safe-area-inset-right,0px)));
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:4px 10px;max-width:min(300px,calc(100vw - 32px));
  background:var(--bg);color:var(--ink);border:var(--bw2,2px) solid var(--box,var(--ink));padding:8px 12px 10px;box-shadow:var(--pop,4px 4px 0 var(--ink));
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.progress-pill.show{opacity:1;transform:none}
.progress-pill b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.progress-pill span{font-size:11.5px;font-weight:var(--w-lbl,800);text-transform:var(--lbl-tt,uppercase);letter-spacing:calc(.05em * var(--lk,1));line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.progress-pill i{grid-column:1 / -1;height:4px;background:var(--faint);display:block}
.progress-pill s{display:block;height:100%;background:var(--fill,var(--ink));text-decoration:none;width:0}
@media (prefers-reduced-motion: reduce){.progress-pill{transition:opacity .15s linear;transform:none}}

html,body{overflow-x:clip}
main > *,.lab-body > *,.grid2 > *,.call{min-width:0}
mjx-container{max-width:100%}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;margin:.4em 0 !important}
@media (max-width:600px){

}

<script>
(function(){
  var btn=document.getElementById("theme-btn"),root=document.documentElement;
  function isDark(){var a=root.getAttribute("data-theme");if(a)return a==="dark";return !!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);}
  function paint(){btn.textContent=isDark()?"Light mode":"Dark mode";}
  btn.addEventListener("click",function(){var n=isDark()?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("qc-theme",n);}catch(e){}paint();});
  paint();
  addEventListener("DOMContentLoaded",function(){var e=document.getElementById("xe-intro");if(e&&window.QUIZ_BANK&&QUIZ_BANK.exam)e.textContent=QUIZ_BANK.exam.intro;});
})();
